name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.20"
  OTP_VERSION: "29"

jobs:
  lint:
    name: Lint, coverage and fuzz
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: lint-${{ runner.os }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix lint
      - run: mix coverage
      - run: mix fuzz

  test:
    name: Tests on ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres, mysql, mariadb]
    env:
      AUTHMK_TEST_DB: ${{ matrix.database }}
      REDIS_URL: redis://localhost:6379
    services:
      valkey:
        image: valkey/valkey:9-alpine
        ports: ["6379:6379"]
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: authmk
          POSTGRES_PASSWORD: authmk
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: authmk
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -uroot -pauthmk" --health-interval 5s --health-retries 20
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_ROOT_PASSWORD: authmk
        ports: ["3307:3306"]
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: test-${{ matrix.database }}-${{ runner.os }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix test

  examples:
    name: Example ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [plug_app, phoenix_app]
    defaults:
      run:
        working-directory: examples/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix authmk.gen.migration --check
      - run: mix test
