name: Release

# Pushing a tag like v1.0.0 creates its GitHub release, with that version's
# CHANGELOG.md section as the notes. Publishing to Hex stays a manual step.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches mix.exs
        run: |
          version=$(grep -m1 -oP '^\s*version: "\K[^"]+' mix.exs)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in mix.exs"
            exit 1
          fi
      - name: Take the notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '/^## /{p = ($0 == "## " v || index($0, "## " v " ") == 1); next} p' \
            CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no \"## $version\" section"
            exit 1
          fi
      # Versions like 1.1.0-rc.1 are marked as pre-releases.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file notes.md $prerelease
