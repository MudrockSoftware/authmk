name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MIX_ENV: test
  # Erlang's source build: no docs, GUI or ODBC.
  KERL_BUILD_DOCS: "no"
  KERL_CONFIGURE_OPTIONS: --without-javac --without-wx --without-odbc --without-debugger --without-observer --without-et

jobs:
  lint:
    name: Lint, coverage and fuzz
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v4
      # Erlang builds from source on Linux (see mise.lock).
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev libncurses-dev
      # Elixir and Erlang from mise.toml, checked against mise.lock's checksums.
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: lint-${{ runner.os }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix lint
      - run: mix coverage
      - run: mix fuzz

  test:
    name: Tests on ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres, mysql, mariadb]
    env:
      AUTHMK_TEST_DB: ${{ matrix.database }}
      REDIS_URL: redis://localhost:6379
    services:
      valkey:
        image: valkey/valkey:9-alpine
        ports: ["6379:6379"]
      redis:
        image: redis:8-alpine
        ports: ["6380:6379"]
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: authmk
          POSTGRES_PASSWORD: authmk
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: authmk
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -uroot -pauthmk" --health-interval 5s --health-retries 20
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_ROOT_PASSWORD: authmk
        ports: ["3307:3306"]
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      # Erlang builds from source on Linux (see mise.lock).
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev libncurses-dev
      # Elixir and Erlang from mise.toml, checked against mise.lock's checksums.
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: test-${{ matrix.database }}-${{ runner.os }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix test
      - name: Redis tests on Redis 8
        run: mix test --only redis
        env:
          REDIS_URL: redis://localhost:6380

  examples:
    name: Example ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [plug_app, phoenix_app]
    defaults:
      run:
        working-directory: examples/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      # Erlang builds from source on Linux (see mise.lock).
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev libncurses-dev
      # Elixir and Erlang from mise.toml, checked against mise.lock's checksums.
      - uses: jdx/mise-action@v5
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix authmk.gen.migration --check
      - run: mix test
